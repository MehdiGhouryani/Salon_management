name: CI

on:
  push:
    branches: [main, 'work/**']
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Typecheck, lint & unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:unit

  integration:
    name: HTTP integration tests (real Express app)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test:integration

  database:
    name: PostgreSQL-backed tests (real DB, fail-closed)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nobatara_test
          POSTGRES_PASSWORD: nobatara_test_pw
          POSTGRES_DB: nobatara_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nobatara_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://nobatara_test:nobatara_test_pw@localhost:5432/nobatara_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Verify the test database is reachable (deliberate failure if not)
        run: node -e "import('pg').then(async ({default: pg}) => { const c = new pg.Client({connectionString: process.env.TEST_DATABASE_URL}); try { await c.connect(); const r = await c.query('SELECT version() v'); console.log('TEST DATABASE REACHABLE:', r.rows[0].v); await c.end(); } catch (e) { console.error('TEST DATABASE UNREACHABLE:', e.message); process.exit(1); } })"
      - run: npm run test:db

  build:
    name: Production build & dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
      - run: npm run audit

  e2e:
    name: Browser E2E (customer journeys, real server + PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nobatara_test
          POSTGRES_PASSWORD: nobatara_test_pw
          POSTGRES_DB: nobatara_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nobatara_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://nobatara_test:nobatara_test_pw@localhost:5432/nobatara_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Verify the E2E database is reachable (deliberate failure if not)
        run: node -e "import('pg').then(async ({default: pg}) => { const c = new pg.Client({connectionString: process.env.DATABASE_URL}); try { await c.connect(); console.log('E2E DATABASE REACHABLE'); await c.end(); } catch (e) { console.error('E2E DATABASE UNREACHABLE:', e.message); process.exit(1); } })"
      - run: npm run db:migrate
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
