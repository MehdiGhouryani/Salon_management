<!doctype html>
<html lang="fa" dir="rtl" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>سامانه مدیریت و نظارت مرکزی سالنهای زیبایی | Salon Admin</title>
    <meta name="description" content="پنل مدیریت جامع ادمین اصلی با امکانات ارتقای UI/UX، مانیتورینگ امنیتی، مدیریت کسبوکارها، کاربران، اشتراکها، صف پیامک و پشتیبانی" />
    <meta property="og:title" content="سامانه مدیریت و نظارت مرکزی سالنهای زیبایی | Salon Admin" />
    <meta property="og:description" content="پنل مدیریت جامع ادمین اصلی با امکانات ارتقای UI/UX، مانیتورینگ امنیتی، مدیریت کسبوکارها، کاربران، اشتراکها، صف پیامک و پشتیبانی" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      /* Apply the saved theme before first paint (deep navy dark is the default;
         an explicitly saved 'light' choice wins) so nothing flashes. */
      try {
        var saved = null;
        try { saved = localStorage.getItem('nobatara_theme'); } catch (se) {}
        var d = saved !== 'light'; /* default: dark unless the user chose light */
        var r = document.documentElement;
        r.classList.toggle('dark', d);
        r.setAttribute('data-theme', d ? 'dark' : 'light');
        r.style.colorScheme = d ? 'dark' : 'light';
      } catch (e) {}
    </script>
  </head>
  <body class="font-sans antialiased selection:bg-[var(--brand-primary)] selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
